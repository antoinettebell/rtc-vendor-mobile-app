apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    debuggableVariants = ["devDebug", "liveGoogleDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Tap to Pay credentials belong in the ignored native configuration file (or
// the secure build environment), never in JavaScript or a committed .env file.
// The SDK itself requires these values to create its native MposUi instance.
def tapToPayProperties = new Properties()
def tapToPayPropertiesFile = rootProject.file("TapToPay.local.properties")
if (tapToPayPropertiesFile.exists()) {
    tapToPayPropertiesFile.withInputStream { tapToPayProperties.load(it) }
}

def releaseSigningPropertyNames = [
    "MYAPP_UPLOAD_STORE_FILE",
    "MYAPP_UPLOAD_STORE_PASSWORD",
    "MYAPP_UPLOAD_KEY_ALIAS",
    "MYAPP_UPLOAD_KEY_PASSWORD",
]
def hasReleaseSigningConfig = releaseSigningPropertyNames.every {
    project.findProperty(it)
}
// Local workstations that already have the approved iOS native configuration
// can use it as a read-only fallback. EAS writes the Android file explicitly.
def iosTapToPayValues = [:]
def iosTapToPayPropertiesFile = rootProject.file("../ios/FoodtruckVendor/TapToPay.local.xcconfig")
if (iosTapToPayPropertiesFile.exists()) {
    iosTapToPayPropertiesFile.eachLine { line ->
        def matcher = (line =~ /^\s*(CYBERSOURCE_TTP_(?:MERCHANT_ID|ACCEPTANCE_DEVICE_SECRET))\s*=\s*(.*?)\s*$/)
        if (matcher.matches()) iosTapToPayValues[matcher.group(1)] = matcher.group(2)
    }
}
def tapToPayBuildValue = { String key ->
    (System.getenv(key) ?: tapToPayProperties.getProperty(key) ?: iosTapToPayValues[key] ?: "").trim()
}
def asBuildConfigString = { String value ->
    "\"${value.replace("\\", "\\\\").replace("\"", "\\\"")}\""
}
def cybersourceTapToPayMerchantId = tapToPayBuildValue("CYBERSOURCE_TTP_MERCHANT_ID")
def cybersourceTapToPayAcceptanceDeviceSecret = tapToPayBuildValue("CYBERSOURCE_TTP_ACCEPTANCE_DEVICE_SECRET")

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.ea.rtcvendor"
    buildFeatures {
        buildConfig true
    }
    packaging {
        resources {
            excludes += ["META-INF/*", "LICENSE.txt", "asm-license.txt"]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
    defaultConfig {
        applicationId "com.rounddacorner.dev.vendor"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 61
        versionName "1.9"
        vectorDrawables.useSupportLibrary = true
        buildConfigField "String", "CYBERSOURCE_TTP_MERCHANT_ID", asBuildConfigString(cybersourceTapToPayMerchantId)
        buildConfigField "String", "CYBERSOURCE_TTP_ACCEPTANCE_DEVICE_SECRET", asBuildConfigString(cybersourceTapToPayAcceptanceDeviceSecret)
    }
    flavorDimensions "distribution"
    productFlavors {
        dev {
            dimension "distribution"
            applicationId "com.rounddacorner.dev.vendor"
        }
        liveGoogle {
            dimension "distribution"
            applicationId "com.ea.rtcvendor"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigningConfig) {
                storeFile file(project.findProperty("MYAPP_UPLOAD_STORE_FILE"))
                storePassword project.findProperty("MYAPP_UPLOAD_STORE_PASSWORD")
                keyAlias project.findProperty("MYAPP_UPLOAD_KEY_ALIAS")
                keyPassword project.findProperty("MYAPP_UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            resValue "string", "build_config_package", "com.ea.rtcvendor"
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            resValue "string", "build_config_package", "com.ea.rtcvendor"
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.google.android.gms:play-services-wallet:19.5.0")
    implementation("io.payworks:paybutton-android:2.115.0")
    implementation("io.payworks:mpos.android.taptophone:2.115.0")

    if ((project.findProperty("hermesEnabled") ?: "true").toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

// AGP 9 validates task inputs more strictly. The lint model reads the vector
// icon font asset directory, so make its producer explicit for release builds.
tasks.configureEach { task ->
    if (task.name.toLowerCase().contains("lintvital")) {
        task.dependsOn("copyReactNativeVectorIconFonts")
    }
}

project.ext.envConfigFiles = [
    devdebug: ".env",
    devrelease: ".env",
    livegoogledebug: ".env.live-google-test",
    livegooglerelease: ".env.live-google-production",
]
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"
