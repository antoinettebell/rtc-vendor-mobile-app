buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 31
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

// AGP 9 no longer enables BuildConfig generation for Android libraries by
// default. Several React Native dependencies declare BuildConfig fields.
subprojects { subproject ->
    subproject.pluginManager.withPlugin("com.android.library") {
        subproject.android.buildFeatures.buildConfig = true
    }
}

allprojects {
    repositories {
        maven { url "https://repo.visa.com/mpos-releases/" }
    }
}
